- aarch64:
    image_name += -aarch64
    vm_arch_name = aarch64
    only arm64-pci
    usb_max_port = 16
    aavmf_vars_filename = vars-template-pflash.raw
    aavmf_code_filename = QEMU_EFI-silent-pflash.raw
    image_boot_image1 = no
    image_boot_cd1 = yes
    bootindex_cd1 = 1
    bootindex_unattended =
    bootindex_virtio =
    send_key_at_install = ret
    # Windows cdboot.efi "Press any key to boot from CD" — 25s (timer starts at QEMU start, not at the prompt), not 120s (hits Setup Cancel)
    send_key_timeout = 25
    cdkey = NPPR9-FWDCX-D2C8J-H872K-2YT43
    # aarch64 virt -serial is PL011; Windows does not expose it as COM1.
    # wait_no_ack: finish via guest shutdown, not COM1 "Post set up finished".
    wait_no_ack = yes
    # After setuprss6 (x86 winutils contract)
    password = 1q2w3eP
    serial_type = pci-serial
    # Working manual: memory-backend-file on /dev/shm (ram hangs at cdboot/WinPE)
    mem = 25600
    vm_mem_backend = memory-backend-file
    vm_mem_backend_path = /dev/shm/avocado-vt-vm1_mem
    vm_mem_share = on
    extra_params = " -device ramfb"
    usb_devices += " keyboard1"
    usbdev_type_keyboard1 = usb-kbd
    # Hyper-V hv_* flags are x86-only; aarch64 QEMU rejects them.
    cpu_model_flags = ""
    # Win11 on ARM requires TPM2; aarch64 uses tpm-tis-device (not tpm-crb)
    tpms = tpm0
    tpm_model_tpm0 = tpm-tis-device
    tpm_type_tpm0 = emulator
    tpm_version_tpm0 = 2.0
    install:
        passwd = 1q2w3eP
    unattended_install.cdrom, whql.support_vm_install, svirt_install, with_installation, check_block_size..extra_cdrom_ks:
        cdrom_cd1 = isos/ISO/WinLegacy/en-us_windows_11_business_editions_version_24h2_updated_april_2025_arm64_dvd_1221f08c.iso
        unattended_file = unattended/win11-autounattend_aarch64.xml
        floppies = "fl"
        floppy_name = images/win11-aarch64/answer.vfd
        extra_cdrom_ks:
            floppies = ""
            unattended_delivery_method = cdrom
            cdroms = "cd1 unattended virtio"
            inject_rss_to_unattended = yes
            drive_index_cd1 = 1
            drive_index_unattended = 2
            drive_index_virtio = 3
            cdrom_unattended = "images/win11-aarch64/autounattend.iso"
            cdrom_virtio = isos/windows/virtio-win-attestation-0.1-298.iso
            # AAVMF cannot boot Win ISO via virtio scsi-cd; usb3 -> usb-storage
            cd_format = usb3
            cd_format_cd1 = usb3
            cd_format_winutils = usb3
            cd_format_unattended = usb3
            cd_format_virtio = usb3
    sysprep:
        unattended_file = unattended/win11-autounattend_aarch64.xml
    balloon_service, balloon_hotplug, balloon_memhp, win_virtio_driver_install_by_installer:
        install_balloon_service = "%s:\Balloon\w11\ARM64\blnsvr.exe -i"
        uninstall_balloon_service = "%s:\Balloon\w11\ARM64\blnsvr.exe -u"
        status_balloon_service = "%s:\Balloon\w11\ARM64\blnsvr.exe status"
        run_balloon_service = "%s:\Balloon\w11\ARM64\blnsvr.exe -r"
        stop_balloon_service = "%s:\Balloon\w11\ARM64\blnsvr.exe -s"
    ## Internal only configuration. Will add to end of upstream file.
    #
    # LOCAL EXPERIMENT on altramax-16 — not upstream yet.
    guest_name += -aarch64
    usb_max_port = 16
    aavmf_vars_filename = vars-template-pflash.raw
    aavmf_code_filename = QEMU_EFI-silent-pflash.raw
    # Default: boot the installed disk. CD boot is install-only (NFS ISOs).
    image_boot_image1 = yes
    image_boot_cd1 = no
    bootindex_image1 = 1
    bootindex_cd1 =
    bootindex_unattended =
    bootindex_virtio =
    cdroms = ""
    send_key_at_install = ret
    # Windows cdboot.efi "Press any key to boot from CD" — 25s (timer starts at QEMU start, not at the prompt), not 120s (hits Setup Cancel)
    send_key_timeout = 25
    cdkey = NPPR9-FWDCX-D2C8J-H872K-2YT43
    # aarch64 virt -serial is PL011; Windows does not expose it as COM1.
    # wait_no_ack: finish via guest shutdown, not COM1 "Post set up finished".
    wait_no_ack = yes
    # After setuprss6 (x86 winutils contract)
    password = 1q2w3eP
    serial_type = pci-serial
    # Critical: memory-backend-ram hangs at TianoCore/cdboot; file+/dev/shm reaches WinPE
    mem = 25600
    vm_mem_backend = memory-backend-file
    vm_mem_backend_path = /dev/shm/avocado-vt-vm1_mem
    vm_mem_share = on
    extra_params = " -device ramfb"
    cpu_model_flags = ""
    unattended_install.cdrom, whql.support_vm_install, with_installation, check_block_size..extra_cdrom_ks:
        cdrom_cd1 = isos/ISO/WinLegacy/en-us_windows_11_business_editions_version_24h2_updated_april_2025_arm64_dvd_1221f08c.iso
        unattended_file = unattended/win11-autounattend_aarch64.xml
        virtio_storage_path = 'A:\ARM64\Win11'
        virtio_network_path = 'A:\ARM64\Win11'
        virtio_scsi_path = 'A:\ARM64\Win11'
        extra_cdrom_ks:
            virtio_storage_path = 'F:\viostor\w11\ARM64'
            virtio_network_path = 'F:\NetKVM\w11\ARM64'
            virtio_scsi_path = 'F:\vioscsi\w11\ARM64'
            virtio_balloon_path = 'F:\Balloon\w11\ARM64'
            virtio_viorng_path = 'F:\viorng\w11\ARM64'
            virtio_vioser_path = 'F:\vioserial\w11\ARM64'
            virtio_vioinput_path = 'F:\vioinput\w11\ARM64'
            virtio_pvpanic_path = 'F:\pvpanic\w11\ARM64'
            virtio_viofs_path = 'F:\viofs\w11\ARM64'
            virtio_fwcfg_path = 'F:\fwcfg\w11\ARM64'
            virtio_viomem_path = 'F:\viomem\w11\ARM64'
            virtio_viosock_path = 'F:\viosock\w11\ARM64'
            virtio_balloon_installer_path = E:\\install_driver.bat F:\\Balloon\\w11\\ARM64
            cdroms = "cd1 unattended virtio"
            inject_rss_to_unattended = yes
            image_boot_image1 = no
            image_boot_cd1 = yes
            bootindex_cd1 = 1
            bootindex_image1 =
            drive_index_virtio = 4
            cdrom_virtio = isos/windows/virtio-win-attestation-0.1-298.iso
            cd_format = usb3
            cd_format_cd1 = usb3
            cd_format_winutils = usb3
            cd_format_unattended = usb3
            cd_format_virtio = usb3
            floppy_name = ""
    sysprep:
        unattended_file = unattended/win11-autounattend_aarch64.xml
